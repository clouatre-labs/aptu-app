name: Android KMP Build

on:
  push:
    branches: [main]
    paths:
      - 'AptuKMP/**'
      - 'crates/aptu-ffi/**'
      - '.github/workflows/android-kmp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AptuKMP/**'
      - 'crates/aptu-ffi/**'
      - '.github/workflows/android-kmp.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set JAVA_HOME to Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        # arm64-v8a only: x86_64 doubles Rust compile time with no CI benefit.
        # Note: ubuntu-26.04 runner uses x86_64 NDK host binaries; ARM64 Linux NDK host
        # support is not yet available (android/ndk#1752). Stay on x86_64 runners.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: true
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('AptuKMP/**/*.gradle.kts', 'AptuKMP/**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Cache gobley-uniffi-bindgen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: AptuKMP/shared/build/gobley-tools-install
          key: gobley-uniffi-bindgen-0.3.7-${{ runner.os }}
      - name: Build and test
        working-directory: AptuKMP
        run: ./gradlew :shared:assembleDebug :androidApp:assembleDebug :shared:testDebugUnitTest :androidApp:testDebugUnitTest --parallel --build-cache

  ci-result:
    name: CI Result
    runs-on: ubuntu-26.04
    permissions: {}
    if: always()
    needs: [build]
    steps:
      - name: Verify all jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
